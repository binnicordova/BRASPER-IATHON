name: Sync submodules to main

# A submodule always stores one commit. This job moves each pointer to the
# latest commit of the main branch of its repository, so this repo follows them.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-submodules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Point every submodule to the latest main
        run: git submodule update --remote

      - name: Commit and push if something moved
        run: |
          if git diff --quiet; then
            echo "Everything is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update submodules to the latest main"
          git push
